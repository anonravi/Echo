        /*
        @description Defines CSS custom properties (variables) for consistent theming throughout the application.
        These variables control background colors, text colors, and accent colors.
        */
        :root {
            /** @property {string} --bg - The primary background color for the application. */
            --bg: #0f172a;
            /** @property {string} --card-bg - The background color for card-like components. */
            --card-bg: #1e293b;
            /** @property {string} --primary - The primary accent color, often used for interactive elements. */
            --primary: #38bdf8;
            /** @property {string} --secondary - A secondary accent color, complementing the primary. */
            --secondary: #818cf8;
            /** @property {string} --text - The default text color for readability. */
            --text: #f8fafc;
            /** @property {string} --accent - An additional accent color for highlights or specific UI elements. */
            --accent: #f472b6;
        }

        /*
        @description Styles for the main body of the HTML document.
        Sets font family, background, text color, and establishes a flexbox layout for centering content.
        */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /*
        @description Styles for a general container element, setting its maximum width and ensuring it takes full width within its constraints.
        */

            max-width: 800px;
            width: 100%;
        }
